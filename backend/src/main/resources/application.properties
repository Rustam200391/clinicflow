spring.application.name=clinicflow-api
spring.profiles.default=dev
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clinicflow}
spring.datasource.username=${DB_USERNAME:clinicflow}
spring.datasource.password=${DB_PASSWORD:clinicflow}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

clinicflow.development-clinic-id=00000000-0000-4000-8000-000000000001
